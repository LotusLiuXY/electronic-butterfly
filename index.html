<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>电子蝴蝶 · EPHEMERAL BUTTERFLY</title>
<style>
  :root{
    --bg:#05060a;
    --cyan:#38f9ff;
    --magenta:#ff3df0;
    --green:#5dff9e;
    --ink:#cfd8ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--bg);}
  body{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;color:var(--ink);cursor:crosshair;}
  canvas{position:fixed;inset:0;display:block;}
  .title{position:fixed;left:50%;top:6vh;transform:translateX(-50%);text-align:center;pointer-events:none;mix-blend-mode:screen;}
  .title h1{font-size:clamp(15px,2.4vw,26px);font-weight:600;letter-spacing:.42em;color:#eaf2ff;text-shadow:0 0 12px rgba(56,249,255,.55);}
  .title .sub{margin-top:6px;font-size:10px;letter-spacing:.45em;color:rgba(207,216,255,.4);}
  .hint{position:fixed;left:50%;bottom:6vh;transform:translateX(-50%);font-size:12px;letter-spacing:.22em;color:rgba(207,216,255,.55);pointer-events:none;transition:opacity 1.2s ease;text-align:center;}
  .hint.hide{opacity:0;}
  .hint .k{color:var(--cyan);}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);}
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="vignette"></div>
  <div class="title">
    <h1>电子蝴蝶</h1>
    <div class="sub">EPHEMERAL · BUTTERFLY · METAMORPHOSIS</div>
  </div>
  <div class="hint" id="hint">移动光标 · <span class="k">点击</span> 触发蜕变：化茧 → 破茧 → 离子消散</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const hint = document.getElementById('hint');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize); resize();

  // 鼠标 / 触摸
  const mouse = { x: W/2, y: H/2, has: false };
  function setMouse(x, y){ mouse.x = x; mouse.y = y; mouse.has = true; hideHint(); }
  window.addEventListener('mousemove', e => setMouse(e.clientX, e.clientY));
  window.addEventListener('touchmove', e => { const t=e.touches[0]; if(t) setMouse(t.clientX,t.clientY); }, {passive:true});
  let hintHidden = false;
  function hideHint(){ if(!hintHidden){ hintHidden = true; hint.classList.add('hide'); } }
  setTimeout(hideHint, 6000);

  const PAL = ['#38f9ff', '#ff3df0', '#5dff9e', '#bfe9ff', '#ffffff'];

  // 预渲染辉光精灵：一次性离屏画好，循环里用 drawImage 贴图（替代昂贵的 shadowBlur）
  const sprites = {};
  function makeSprite(color){
    const s = 64, c = document.createElement('canvas'); c.width = c.height = s;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    grd.addColorStop(0, color);
    grd.addColorStop(0.22, color);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.fillRect(0, 0, s, s);
    return c;
  }
  for(const col of PAL) sprites[col] = makeSprite(col);

  // 蝴蝶曲线基准点 (Fay's butterfly)
  function makeButterfly(n){
    const pts = [];
    for(let i=0;i<n;i++){
      const t = (i/n) * 12 * Math.PI;
      const e = Math.exp(Math.cos(t)) - 2*Math.cos(4*t) - Math.pow(Math.sin(t/12), 5);
      pts.push({ x: Math.sin(t) * e / 4.2, y: -Math.cos(t) * e / 4.2 });
    }
    return pts;
  }
  const N = 560;
  const base = makeButterfly(N);

  const P = [];
  const rnd = (a,b) => a + Math.random()*(b-a);
  for(let i=0;i<N;i++){
    P.push({
      x: rnd(0,W), y: rnd(0,H),
      vx: 0, vy: 0, tx: 0, ty: 0,
      a: rnd(.5,1), aT: 1,
      size: rnd(1.1, 2.6),
      col: PAL[(Math.random()*PAL.length)|0],
      flick: Math.random()*Math.PI*2
    });
  }

  const cx = { x: W/2, y: H/2 };
  let scale = Math.min(W,H) * 0.16;
  let state = 'butterfly', stateStart = performance.now(), lastInteract = performance.now();
  let flapPhase = 0, emergePop = 1;
  const T = { cocoon: 1500, emerge: 1100, dissipate: 1700 };
  let cocoonC = {x:0,y:0}, cocoonTargets = null;

  function assignCocoon(){
    cocoonC.x = cx.x; cocoonC.y = cx.y;
    const w = scale*0.5, h = scale*1.5;
    cocoonTargets = [];
    for(let i=0;i<N;i++){
      const ang = Math.random()*Math.PI*2, r = Math.sqrt(Math.random());
      const taper = 1 - 0.45*Math.abs(Math.sin(Math.random()*Math.PI));
      cocoonTargets.push({ x: cocoonC.x + Math.cos(ang)*w*r*taper, y: cocoonC.y + Math.sin(ang)*h*r });
    }
  }

  function triggerMetamorphosis(){
    if(state !== 'butterfly') return;
    state = 'cocoon'; stateStart = performance.now(); lastInteract = performance.now();
    assignCocoon();
    for(const p of P){ p.vx = 0; p.vy = 0; p.aT = 1; }
  }
  window.addEventListener('click', triggerMetamorphosis);
  window.addEventListener('touchstart', () => triggerMetamorphosis(), {passive:true});

  let last = performance.now();
  function frame(now){
    const dt = Math.min(40, now - last); last = now;
    const time = now/1000;

    const sd = now - stateStart;
    if(state === 'cocoon' && sd > T.cocoon){
      state = 'emerge'; stateStart = now; emergePop = 1.6;
      for(const p of P){ p.aT = 1; p.size = rnd(1.3,3.0); }
    } else if(state === 'emerge' && sd > T.emerge){
      state = 'dissipate'; stateStart = now;
      for(const p of P){
        const ang = Math.atan2(p.y - cx.y, p.x - cx.x) + rnd(-.5,.5);
        const sp = rnd(1.2, 4.5) * (scale/120);
        p.vx = Math.cos(ang)*sp + rnd(-.4,.4);
        p.vy = Math.sin(ang)*sp - rnd(.6,1.8);
        p.aT = 0;
      }
    } else if(state === 'dissipate'){
      let sum = 0; for(const p of P) sum += p.a;
      if(sum/N < 0.06){ state = 'butterfly'; stateStart = now; emergePop = 1.3;
        for(const p of P){ p.x = cx.x + rnd(-20,20); p.y = cx.y + rnd(-20,20); p.vx = 0; p.vy = 0; p.a = 0; p.aT = 1; }
      }
    }
    if(state === 'butterfly' && now - lastInteract > 9000 && now - stateStart > 3500) triggerMetamorphosis();

    // 全屏跟随光标
    const minX = scale*1.3, maxX = W - scale*1.3, minY = H*0.14, maxY = H*0.9;
    let targetX = mouse.has ? mouse.x : cx.x + Math.sin(time*0.6)*40;
    let targetY = mouse.has ? mouse.y : H/2 + Math.cos(time*0.5)*30;
    targetX = Math.max(minX, Math.min(maxX, targetX));
    targetY = Math.max(minY, Math.min(maxY, targetY));
    if(state !== 'dissipate' && state !== 'reform'){ cx.x += (targetX - cx.x) * 0.06; cx.y += (targetY - cx.y) * 0.06; }

    flapPhase += dt * 0.012;
    const flap = 0.55 + 0.45*Math.sin(flapPhase*6);
    emergePop += (1 - emergePop) * 0.08;
    const curScale = scale * emergePop;

    // 拖尾
    ctx.fillStyle = 'rgba(5,6,10,0.22)';
    ctx.fillRect(0,0,W,H);

    ctx.globalCompositeOperation = 'lighter';
    for(let i=0;i<N;i++){
      const p = P[i];
      if(state === 'butterfly' || state === 'emerge'){
        const b = base[i], fx = state === 'emerge' ? b.x : b.x * flap;
        p.tx = cx.x + fx * curScale; p.ty = cx.y + b.y * curScale;
        p.x += (p.tx - p.x) * 0.18; p.y += (p.ty - p.y) * 0.18;
      } else if(state === 'cocoon'){
        const c = cocoonTargets[i], pulse = 1 + 0.05*Math.sin(time*5 + i);
        p.tx = c.x; p.ty = c.y + (c.y - cocoonC.y) * (pulse - 1);
        p.x += (p.tx - p.x) * 0.16; p.y += (p.ty - p.y) * 0.16;
      } else if(state === 'dissipate'){
        p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.vx *= 0.985; p.vy *= 0.99;
      }
      p.a += (p.aT - p.a) * 0.06; p.flick += 0.2;
      const tw = 0.75 + 0.25*Math.sin(p.flick);
      let alpha = p.a * tw; if(state === 'dissipate') alpha *= Math.max(0, p.a);
      const sz = p.size * (state === 'dissipate' ? (1 + (1-p.a)*1.4) : 1) * 4;
      ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
      ctx.drawImage(sprites[p.col], p.x - sz, p.y - sz, sz*2, sz*2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.addEventListener('resize', () => { scale = Math.min(W,H) * 0.16; });
})();
</script>
</body>
</html>
